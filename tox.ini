[tox]
envlist =
    py39,
    py310,
    py311,
    lint,
    security,
    docs
isolated_build = True

[testenv]
description = run unit tests
deps =
    pytest>=8.0.0
    pytest-cov>=4.1.0
    pytest-mock>=3.12.0
    pytest-asyncio>=0.23.5
    pytest-xdist>=3.5.0
    -r requirements.txt
    -r requirements-dev.txt
commands =
    pytest {posargs:tests}

[testenv:lint]
description = run linters
skip_install = true
deps =
    black>=24.1.1
    flake8>=7.0.0
    isort>=5.13.2
    mypy>=1.8.0
    pylint>=3.0.3
commands =
    black {posargs:telecomdb1 tests}
    isort {posargs:telecomdb1 tests}
    flake8 {posargs:telecomdb1 tests}
    mypy {posargs:telecomdb1}
    pylint {posargs:telecomdb1}

[testenv:security]
description = run security checks
skip_install = true
deps =
    bandit>=1.7.7
    safety>=2.3.5
commands =
    bandit -r {posargs:telecomdb1}
    safety check

[testenv:docs]
description = build documentation
deps =
    Sphinx>=7.2.6
    sphinx-rtd-theme>=2.0.0
    sphinx-autodoc-typehints>=1.25.2
    myst-parser>=2.0.0
commands =
    sphinx-build -b html docs/source docs/build/html
    sphinx-build -b linkcheck docs/source docs/build/linkcheck

[flake8]
max-line-length = 88
extend-ignore = E203
exclude = .git,__pycache__,build,dist

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

[pylint]
max-line-length = 88
disable = C0111,R0903,C0103
good-names = i,j,k,ex,Run,_,id,db

[coverage:run]
source = telecomdb1
omit =
    tests/*
    setup.py
    conftest.py
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError 